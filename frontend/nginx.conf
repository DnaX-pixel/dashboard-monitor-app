server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must NEVER be cached — it references hashed asset filenames
    # that change on every build. If the browser caches the old index.html,
    # it will keep loading stale JS/CSS bundles.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Vite generates content-hashed filenames (index-AbCd1234.js) so these
    # can be cached aggressively forever — when content changes, the filename
    # changes, and the new index.html references the new file.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy static files (screenshots) to backend
    location /static/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
}