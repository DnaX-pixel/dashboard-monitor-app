<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password | WebGuard Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Sans:wght@400;500;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0a0b14;
            color: #e8eaf2;
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: rgba(15, 17, 32, 0.7);
            backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .primary-gradient {
            background: linear-gradient(135deg, #8083ff 0%, #571bc1 100%);
        }

        .glow-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .btn-active:active {
            transform: scale(0.98);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 25%,
                rgba(255, 255, 255, 0.03) 50%,
                transparent 75%
            );
            animation: shimmer-anim 6s linear infinite;
        }

        @keyframes shimmer-anim {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<!-- THEME CONFIGURATION -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#c0c1ff",
                    "border-bold": "rgba(255, 255, 255, 0.1)",
                    "on-error": "#690005",
                    "surface-variant": "#33343e",
                    "on-surface-variant": "#c7c4d7",
                    "error-container": "#93000a",
                    "surface-container-low": "#1a1b24",
                    "surface": "#0f1120",
                    "tertiary-container": "#00885d",
                    "text-primary": "#e8eaf2",
                    "on-primary-container": "#0d0096",
                    "on-secondary": "#3c0091",
                    "on-tertiary-fixed-variant": "#005236",
                    "success": "#10b981",
                    "primary-fixed": "#e1e0ff",
                    "on-secondary-container": "#c4abff",
                    "surface-container-highest": "#33343e",
                    "surface-interactive": "#1c1f30",
                    "outline": "#908fa0",
                    "on-error-container": "#ffdad6",
                    "border-subtle": "rgba(255, 255, 255, 0.06)",
                    "on-tertiary-fixed": "#002113",
                    "secondary-container": "#571bc1",
                    "primary-fixed-dim": "#c0c1ff",
                    "text-dim": "#9ca0b3",
                    "danger": "#f43f5e",
                    "inverse-on-surface": "#2f303a",
                    "secondary": "#d0bcff",
                    "surface-tint": "#c0c1ff",
                    "tertiary": "#4edea3",
                    "error": "#ffb4ab",
                    "surface-container-lowest": "#0d0e17",
                    "on-tertiary-container": "#000703",
                    "inverse-surface": "#e3e1ef",
                    "inverse-primary": "#494bd6",
                    "on-secondary-fixed-variant": "#5516be",
                    "tertiary-fixed": "#6ffbbe",
                    "surface-dim": "#12131c",
                    "secondary-fixed": "#e9ddff",
                    "on-tertiary": "#003824",
                    "surface-bright": "#383843",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "on-primary": "#1000a9",
                    "on-background": "#e3e1ef",
                    "on-primary-fixed": "#07006c",
                    "outline-variant": "#464554",
                    "on-secondary-fixed": "#23005c",
                    "surface-container": "#1e1f29",
                    "secondary-fixed-dim": "#d0bcff",
                    "background": "#12131c",
                    "surface-container-high": "#282933",
                    "tertiary-fixed-dim": "#4edea3",
                    "surface-elevated": "#161827",
                    "on-surface": "#e3e1ef",
                    "text-muted": "#7b8095",
                    "primary-container": "#8083ff",
                    "warning": "#f59e0b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "content-padding": "28px",
                    "unit-tight": "4px",
                    "grid-gap": "16px",
                    "form-gutter": "18px",
                    "unit-base": "8px",
                    "card-padding": "24px",
                    "sidebar-width": "260px",
                    "topbar-height": "64px"
            },
            "fontFamily": {
                    "h2": ["Plus Jakarta Sans"],
                    "sidebar-link": ["DM Sans"],
                    "mono-technical": ["JetBrains Mono"],
                    "h1": ["Plus Jakarta Sans"],
                    "data-display": ["Plus Jakarta Sans"],
                    "body-lg": ["DM Sans"],
                    "label-caps": ["DM Sans"],
                    "body-sm": ["DM Sans"]
            },
            "fontSize": {
                    "h2": ["15px", {"lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "sidebar-link": ["10px", {"lineHeight": "14px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "mono-technical": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "h1": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "data-display": ["28px", {"lineHeight": "34px", "fontWeight": "800"}],
                    "body-lg": ["14px", {"lineHeight": "22px", "fontWeight": "500"}],
                    "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "700"}],
                    "body-sm": ["13px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen overflow-hidden p-6">
<!-- Atmospheric Background Animation -->

<!-- Centered Auth Card -->
<main class="relative z-10 w-full max-w-md">
<!-- Brand Identity Header -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 rounded-2xl primary-gradient flex items-center justify-center shadow-[0_0_30px_rgba(128,131,255,0.3)] mb-4">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">vpn_key</span>
</div>
<h1 class="font-h1 text-h1 text-text-primary tracking-tight">Forgot Password</h1>
<p class="font-body-sm text-body-sm text-text-muted mt-2 text-center max-w-xs">
                Enter your email and we'll send you a reset link to regain access to WebGuard Pro.
            </p>
</div>
<!-- Card Container -->
<div class="glass-panel rounded-xl p-card-padding shadow-2xl relative shimmer">
<form class="space-y-6" id="forgot-password-form">
<!-- Input Group -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-primary uppercase block" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-dim group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">mail</span>
</div>
<input class="w-full bg-surface-container-low border border-border-subtle rounded-lg py-3 pl-11 pr-4 font-body-sm text-body-sm text-text-primary focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-text-muted/50" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-3.5 px-6 primary-gradient text-white font-body-lg text-body-lg rounded-lg shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-body-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Success State Overlay (Hidden by default) -->
<div class="absolute inset-0 bg-surface flex flex-col items-center justify-center p-card-padding text-center opacity-0 pointer-events-none transition-opacity duration-300" id="success-state">
<div class="w-12 h-12 rounded-full bg-success/20 flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-success text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h3 class="font-h2 text-h2 text-text-primary mb-2">Email Sent</h3>
<p class="font-body-sm text-body-sm text-text-muted">
                    If an account exists for <span class="text-primary font-medium" id="display-email"></span>, you will receive password reset instructions shortly.
                </p>
<button class="mt-6 font-body-sm text-body-sm text-primary hover:underline" onclick="toggleState()">
                    Didn't receive it? Try again
                </button>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-8 flex flex-col items-center gap-4">
<a class="flex items-center gap-2 font-body-sm text-body-sm text-text-dim hover:text-primary transition-colors group" href="login.html">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span>Back to Login</span>
</a>
<div class="flex items-center gap-6 mt-4">
<span class="h-px w-8 bg-border-subtle"></span>
<span class="font-label-caps text-[9px] text-text-muted/40 uppercase tracking-[0.2em]">Secure Access Node</span>
<span class="h-px w-8 bg-border-subtle"></span>
</div>
</div>
</main>
<!-- UI Background Decoration -->
<div class="fixed top-0 right-0 w-[500px] h-[500px] bg-secondary/5 blur-[120px] rounded-full pointer-events-none -translate-y-1/2 translate-x-1/2"></div>
<div class="fixed bottom-0 left-0 w-[400px] h-[400px] bg-primary/5 blur-[100px] rounded-full pointer-events-none translate-y-1/4 -translate-x-1/4"></div>
<script>
        // Micro-interactions and Form Handling
        const form = document.getElementById('forgot-password-form');
        const successState = document.getElementById('success-state');
        const displayEmail = document.getElementById('display-email');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            displayEmail.textContent = emailInput.value;
            
            // Trigger visual success state
            successState.classList.remove('opacity-0', 'pointer-events-none');
            successState.classList.add('opacity-100');
            
            // Simulate API feedback with button loading state (optional)
            const btn = form.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1000);
        });

        function toggleState() {
            successState.classList.add('opacity-0', 'pointer-events-none');
            successState.classList.remove('opacity-100');
        }

        // Add subtle movement to the card based on mouse position
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-panel');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body></html>
