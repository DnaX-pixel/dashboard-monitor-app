services:
  # ── MySQL Database ──
  mysql:
    image: mysql:8.4
    container_name: monitor-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dashboard_monitor
      MYSQL_USER: monitor_user
      MYSQL_PASSWORD: monitor_pass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── phpMyAdmin ──
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: monitor-phpmyadmin
    restart: unless-stopped
    ports:
      - "8181:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitor-net

  # ── Backend API ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: monitor-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
      - backend-auth:/app/auth_info
    env_file:
      - backend/.env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=dashboard_monitor
      - DB_USER=monitor_user
      - DB_PASS=monitor_pass
      - DATA_DIR=/app/data
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - monitor-net

  # ── Ollama OCR Engine ──
  ollama:
    image: ollama/ollama:latest
    container_name: monitor-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - monitor-net
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Frontend (nginx) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: monitor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - monitor-net

volumes:
  mysql-data:
  backend-data:
  backend-auth:
  ollama-models:

networks:
  monitor-net:
    driver: bridge
